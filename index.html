<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        .top-image img {
            width: 500%;
            height: auto;
            max-width: 1500px;
            display: block;
        }
        
        .profile-img {
            display: block;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            margin: 20px auto;
            border: 5px solid #e493c6;
        }
        
        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        
        h3 {
            color: #e493c6;
        }
        
        .contact-section {
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            text-align: center;
        }
        
        .contact-btn {
            display: inline-block;
            background-color: #e493c6;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        
        .contact-btn:hover {
            background-color: #d17db3;
        }
        
        footer {
            background-color: #e493c6; 
            color: white; 
            padding: 20px; 
            text-align: center; 
            margin-top: 30px;
        }

        footer a {
            color: #fff;
            text-decoration: none; 
            margin: 0 10px;
        }
        
        footer a:hover {
            color: #151b15;
        }
    </style>
</head>
<body>
    <div class="top-image">
       <center> <img src="emojiwallpaper.jpg" alt="emoji wallpaper"></center>
    </div>
    
    <main>
        <img src="sohee.jpg" alt="Profile Image" class="profile-img">
        
        <h1>Hello</h1>
        <p style="text-align: center;">IT student.</p>
        
        <h2>My Skills</h2>
        <h3>Design and Development</h3>
        <p>HTML and CSS</p>
        
        <h3>Learning HTML and CSS</h3>
        <p>Fun.</p>
        
        <div class="contact-section">
            <h2>Get in Touch</h2>
            <p>If you love coding.</p>
            <a href="mailto:andreidaguison@gmail.com" class="contact-btn">Contact Me</a>
        </div>
    </main>

    <footer>
        <p><a href="#">Facebook</a> | <a href="#">Instagram</a> | <a href="#">Website</a></p>
    </footer>
</body>
</html>
